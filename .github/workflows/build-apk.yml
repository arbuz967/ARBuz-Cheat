
name: Build ARBUZ APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ZIP archive not found"
            exit 1
          fi
          mkdir source
          unzip -q "$ZIP" -d source
          test -f source/arbuz_ci/settings.gradle

      - name: Fix Java login button
        run: |
          FILE="source/arbuz_ci/app/src/main/java/com/arbuz/cheat/MainActivity.java"

          sed -i 's/Button login = button(/final Button[] loginRef = new Button[1]; loginRef[0] = button(/' "$FILE"
          sed -i 's/login.setEnabled(false);/loginRef[0].setEnabled(false);/' "$FILE"
          sed -i 's/verifyKey(key, status, login);/verifyKey(key, status, loginRef[0]);/' "$FILE"
          sed -i 's/root.addView(login);/root.addView(loginRef[0]);/' "$FILE"

          grep -n 'loginRef' "$FILE"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd source/arbuz_ci
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARBUZ-debug-APK
          path: source/arbuz_ci/app/build/outputs/apk/debug/app-debug.apk
