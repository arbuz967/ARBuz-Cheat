
name: Build ARBUZ APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          test -n "$ZIP"
          mkdir source
          unzip -q "$ZIP" -d source
          test -f source/arbuz_ci/settings.gradle

      - name: Fix Java compilation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("source/arbuz_ci/app/src/main/java/com/arbuz/cheat/MainActivity.java")
          s = p.read_text()
          old = '''        Button login = button("ВОЙТИ", () -> {
            String key = keyInput.getText().toString().trim();
            if (!key.matches("ArbuzShop[0-9]{10}")) {
                status.setText("Неверный формат. Ожидается ArbuzShop и 10 цифр.");
                return;
            }
            status.setText("Проверка ключа…");
            login.setEnabled(false);
            verifyKey(key, status, login);
        });
        root.addView(login);'''
          new = '''        final Button[] loginRef = new Button[1];
        loginRef[0] = button("ВОЙТИ", () -> {
            String key = keyInput.getText().toString().trim();
            if (!key.matches("ArbuzShop[0-9]{10}")) {
                status.setText("Неверный формат. Ожидается ArbuzShop и 10 цифр.");
                return;
            }
            status.setText("Проверка ключа…");
            loginRef[0].setEnabled(false);
            verifyKey(key, status, loginRef[0]);
        });
        root.addView(loginRef[0]);'''
          if old not in s:
              raise SystemExit("Expected Java code block not found")
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd source/arbuz_ci
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARBUZ-debug-APK
          path: source/arbuz_ci/app/build/outputs/apk/debug/app-debug.apk
